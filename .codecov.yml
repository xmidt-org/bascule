---
coverage:
  range: 90..100
  round: down
  precision: 2
  status:
    project:
      default:
        target: 100%
        threshold: 0.5%
    patch:
      default:
        target: 100%
        threshold: 0.5%

ignore:
  - "*_test.go"
  - "vendor"
  # main only calls run, which is tested; it cannot be covered without
  # executing the binary.
  - "cmd/hash/main.go"

fixes:
  - "github.com/xmidt-org/bascule/::"
